
<!-- Dataset buttons grouped by category -->
<div id="category-groups" style="margin-bottom: 20px;"></div>

<canvas id="performanceChart" width="1000" height="500"></canvas>

<style>
  .category-heading {
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 5px;
  }
  .dataset-button {
    padding: 6px 12px;
    margin: 4px 6px;
    border: none;
    background-color: #eee;
    cursor: pointer;
    border-radius: 5px;
  }
  .dataset-button.active {
    background-color: #555;
    color: white;
  }

  [data-dark="true"] .category-heading {
    color: var(--text);
  }
  [data-dark="true"] .dataset-button {
    background-color: var(--light-gray);
    color: var(--text);
  }
  [data-dark="true"] .dataset-button.active {
    background-color: #aaa;
    color: #111;
  }
  [data-dark="true"] #model-caption {
    color: var(--text) !important;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>

<script>
const rawData = [
  {% for item in site.data.performance %}
    {
      model: "{{ item.model }}",
      model_alias: "{{ item.model_alias }}",
      dataset: "{{ item.dataset }}",
      category: "{{ item.category }}",
      precision: {{ item.precision | default: 'null' }},
      precision_ci: {{ item.precision_ci | jsonify }},
      recall: {{ item.recall | default: 'null' }},
      recall_ci: {{ item.recall_ci | jsonify }},
      f1: {{ item.f1 | default: 'null' }},
      f1_ci: {{ item.f1_ci | jsonify }}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];

let chart;

function groupDatasetsByCategory() {
  const grouped = {};
  rawData.forEach(d => {
    if (!grouped[d.category]) grouped[d.category] = new Set();
    grouped[d.category].add(d.dataset);
  });
  Object.keys(grouped).forEach(k => grouped[k] = [...grouped[k]].sort());
  return grouped;
}

function renderCategoryButtons() {
  const container = document.getElementById("category-groups");
  container.innerHTML = "";
  const grouped = groupDatasetsByCategory();
  let first = true;

  Object.entries(grouped).forEach(([category, datasets]) => {
    const heading = document.createElement("div");
    heading.className = "category-heading";
    heading.textContent = category;
    container.appendChild(heading);

    datasets.forEach(ds => {
      const btn = document.createElement("button");
      btn.className = "dataset-button";
      btn.textContent = ds;
      btn.onclick = () => {
        document.querySelectorAll(".dataset-button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderDatasetChart(ds);
      };
      container.appendChild(btn);

      if (first) {
        btn.classList.add("active");
        renderDatasetChart(ds);
        first = false;
      }
    });
  });
}

function isDark() {
  return document.documentElement.getAttribute('data-dark') === 'true';
}

function renderDatasetChart(selectedDataset) {
  const dark = isDark();
  const textColor = dark ? '#d9d7d7' : '#666';
  const gridColor = dark ? '#404040' : 'rgba(0,0,0,0.1)';
  const ciColor = dark ? '#d9d7d7' : '#000';
  const data = rawData.filter(d => d.dataset === selectedDataset);
  const aliases = data.map(d => d.model_alias || d.model);
  const fullNames = data.map(d => `${d.model_alias || d.model}: ${d.model}`);

  const buildMetricDataset = (metric, color) => {
    return {
      label: metric.toUpperCase(),
      data: data.map(d => ({
        x: d.model_alias || d.model,
        y: d[metric],
        ci: d[metric + "_ci"]
      })),
      backgroundColor: color
    };
  };

  const datasets = [
    buildMetricDataset("precision", "rgba(255, 99, 132, 0.7)"),
    buildMetricDataset("recall", "rgba(54, 162, 235, 0.7)"),
    buildMetricDataset("f1", "rgba(75, 192, 192, 0.7)")
  ];

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("performanceChart").getContext("2d"), {
    type: "bar",
    data: {
      datasets: datasets
    },
    options: {
      parsing: {
        xAxisKey: 'x',
        yAxisKey: 'y'
      },
      responsive: true,
      plugins: {
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const val = ctx.raw?.y;
              const ci = ctx.raw?.ci;
              if (!val) return `${ctx.dataset.label}: N/A`;
              if (ci) {
                return `${ctx.dataset.label}: ${val.toFixed(2)} (CI: ${ci[0].toFixed(2)} - ${ci[1].toFixed(2)})`;
              }
              return `${ctx.dataset.label}: ${val.toFixed(2)}`;
            }
          }
        },
        legend: { position: "top", labels: { color: textColor } },
        title: {
          display: true,
          text: `Model Performance: ${selectedDataset}`,
          color: textColor
        }
      },
      scales: {
        x: {
          type: 'category',
          title: { display: true, text: "Model (Alias)", color: textColor },
          ticks: { color: textColor },
          grid: { color: gridColor }
        },
        y: {
          beginAtZero: true,
          max: 1,
          title: { display: true, text: "Score", color: textColor },
          ticks: { color: textColor },
          grid: { color: gridColor }
        }
      }
    },
    plugins: [{
      id: 'ci-lines',
      afterDatasetsDraw(chart) {
        const ctx = chart.ctx;
        const capWidth = 10;

        chart.data.datasets.forEach((dataset, datasetIndex) => {
          const meta = chart.getDatasetMeta(datasetIndex);
          dataset.data.forEach((point, i) => {
            const bar = meta.data[i];
            if (!point || !bar || !point.ci) return;

            const x = bar.x;
            const yTop = chart.scales.y.getPixelForValue(point.ci[1]);
            const yBottom = chart.scales.y.getPixelForValue(point.ci[0]);

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, yTop);
            ctx.lineTo(x, yBottom);
            ctx.lineWidth = 2;
            ctx.strokeStyle = document.documentElement.getAttribute('data-dark') === 'true' ? '#d9d7d7' : '#000';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - capWidth / 2, yTop);
            ctx.lineTo(x + capWidth / 2, yTop);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - capWidth / 2, yBottom);
            ctx.lineTo(x + capWidth / 2, yBottom);
            ctx.stroke();

            ctx.restore();
          });
        });
      }
    }]
  });

  const captionId = "model-caption";
  let caption = document.getElementById(captionId);
  if (!caption) {
    caption = document.createElement("div");
    caption.id = captionId;
    caption.style.marginTop = "10px";
    caption.style.fontSize = "0.9em";
    caption.style.color = "#555";
    document.getElementById("performanceChart").after(caption);
  }
  caption.innerHTML = `<strong>Model mapping:</strong><br>• ${fullNames.map(name => {
  const [alias, full] = name.split(':');
  return `<strong>${alias.trim()}</strong>: ${full.trim()}`;
}).join('• ')}`;
  
}

renderCategoryButtons();

// Re-render chart when dark mode is toggled
new MutationObserver(() => {
  const active = document.querySelector('.dataset-button.active');
  if (active) active.click();
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-dark'] });
</script>
