  </button>


  <!-- Create the dropdown menu -->
  <div class="dropdown-menu">
    <ul>

        <ul>

    </ul>
  </div>
</div>

<!-- CSS -->
<style>
  .dropdown-container {
    position: relative;
    display: inline-block;
    text-align: center; /* Center the button and the text */
  }

  .dropdown-toggle {
    display: flex;
    margin: 0 auto;
    width: auto;
    justify-content: center;
    align-items: center;
    transition: transform 0.3s ease;
    width: 230px;
    height: 40px;
    border-radius: 5px;
    background-color: rgb(255, 255, 255);
    border: none;
  }

  .arrow-icon.flipped {
    transform: rotate(180deg);
  }

  .toggle-text {
    margin-right: 5px; /* Add spacing between text and arrow */
    font-size: large;
    font-weight: bold;
  }

  .dropdown-menu {
    display: none;
    background-color: #ffffff;
    width: 410px;
    border-radius: 8px;
    padding: 10px;
    top: 100%;
    left: 0;
    right: 0;
    margin: auto;
  
  }

  .dropdown-menu.show {
    display: block;
  }

  .dropdown-menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .dropdown-menu a {
    color: rgb(32, 37, 50);
    font-family: "Roboto", sans-serif;
    font-size: medium;
    font-weight: 549;
    display: block;
    padding: 5px 15px; /* Adjust padding to have equal left and right padding */
    text-decoration: none;
    border-bottom: 1px solid #ccc; /* Move the border to the bottom */
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1), 0 0 8px rgba(0, 0, 0, 0.1);
    border-radius: 15px;
  }

  .dropdown-menu a:hover {
    color: #437980;
  }

  .dropdown-menu ul ul {
    padding-left: 0px;
  }

  .dropdown-menu ul li {
    margin-bottom: 5px;
  }

  .dropdown-menu .parent-link > a {
    font-weight: bold;
  }

  [data-dark="true"] .dropdown-menu  {
    background-color: #1a1919;
  }

  [data-dark="true"] .dropdown-menu a {
    background: #1a1919;
    color: rgb(233, 234, 234);
    border: 1px solid #ccc;
  }

  [data-dark="true"] .dropdown-toggle {
    background-color: #1a1919;
  }

  [data-dark="true"] .toggle-text {
   color: #e5e2e2;
  }


</style>



<!-- JavaScript -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var dropdownToggle = document.querySelector('.dropdown-toggle');
    var dropdownMenu = document.querySelector('.dropdown-menu');
    var arrowIcon = dropdownToggle.querySelector('.arrow-icon');

    // Function to toggle the dropdown menu and arrow icon
    function toggleDropdownMenu() {
      var isMenuHidden = !dropdownMenu.classList.contains('show');

      dropdownMenu.classList.toggle('show', isMenuHidden);
      arrowIcon.classList.toggle('flipped', !isMenuHidden);
    }

    dropdownToggle.addEventListener('click', function() {
      toggleDropdownMenu();
    });

    // Close the dropdown menu when clicking outside the container
    document.addEventListener('click', function(event) {
      var isClickedInsideContainer = dropdownToggle.contains(event.target) || dropdownMenu.contains(event.target);
      if (!isClickedInsideContainer) {
        dropdownMenu.classList.remove('show');
        arrowIcon.classList.add('flipped');
      }
    });

    // Initial state: arrow facing down
    arrowIcon.classList.add('flipped');
  });
</script>
