
<div class="dashboard-dropdown">
  <!-- Add a button to toggle the dropdown menu -->
  <button class="dashboard-dropdown__toggle" type="button" aria-expanded="false" aria-controls="dashboard-menu">
    <span class="dashboard-dropdown__toggle-text">More Dashboards</span>
    <span class="dashboard-dropdown__arrow" aria-hidden="true">&#x25B2;</span>
  </button>

  <!-- Create the dropdown menu -->
  <div id="dashboard-menu" class="dashboard-dropdown__menu">
    <ul>
      <li class="parent-link">
       <!--  <a href="#"> Non-Medical Use of PM <span class="subtitle">Subtitle Text Here</span>  -->
        </a>
        <ul>
	  {% assign subdashboards = site.data["dashboards"] %}
	  {% for post in subdashboards %}
          <li><a href="{{ post.link }}">{{ post.title }}<span class="subtitle">{{ post.group }}</span></a></li>
	  {% endfor %}
        </ul>
      </li> 
    </ul>
  </div>
</div>




<!-- CSS -->
<style>
  .dashboard-dropdown {
    position: relative;
    display: inline-block;
    text-align: center; /* Center the button and the text */
  }

  .dashboard-dropdown__toggle {
    display: flex;
    margin: 0 auto;
    width: auto;
    justify-content: center;
    align-items: center;
    width: 230px;
    height: 40px;
    border-radius: 5px;
    background-color: rgb(255, 255, 255);
    border: none;
    transition: transform 0.3s ease;
  }

  .dashboard-dropdown__arrow.flipped {
    transform: rotate(180deg);
  }

  .dashboard-dropdown__toggle-text {
    margin-right: 5px; /* Add spacing between text and arrow */
    font-size: large;
    font-weight: bold;
  }

 
  .dashboard-dropdown__menu {
    opacity: 0;
    visibility: hidden;
    background-color: #ffffff;
    width: 500px;
    border-radius: 8px;
    padding: 0;
    top: 100%;
    left: 0;
    right: 0;
    margin: auto;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.5s ease, max-height 0.5s ease, visibility 0s linear 0.5s, padding 0.3s ease;
  }

  .dashboard-dropdown__menu.show {
    opacity: 1;
    visibility: visible;
    max-height: 1000px;
    padding: 10px;
    transition-delay: 0s;
    transition: opacity 1.3s ease, max-height 1.3s ease, visibility 0s;
   
  }

  .dashboard-dropdown__menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .dashboard-dropdown__menu a {
    color: rgb(32, 37, 50);
   
    font-size: medium;
    font-weight: 430;
    display: block;
    padding: 5px 15px; /* Adjust padding to have equal left and right padding */
    text-decoration: none;
    border-bottom: 1px solid #ccc; /* Move the border to the bottom */
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1), 0 0 8px rgba(0, 0, 0, 0.1);
    border-radius: 15px;

    position: relative;
  }

   .dashboard-dropdown__menu a:hover {
    background-color: #badde2;
  }

  .dashboard-dropdown__menu ul ul {
    padding-left: 0px;
  }

  .dashboard-dropdown__menu ul li {
    margin-bottom: 5px;
  }

.subtitle {
  font-size: 12px; 
  color: #999; 
  margin-left: 15px; /* Add space between the link and the subtitle */
}



  /* Dark Mode */

  [data-dark="true"] .dashboard-dropdown__menu  {
    background-color: #1a1919;
  }

  [data-dark="true"] .dashboard-dropdown__menu a {
    background: #1a1919;
    color: rgb(233, 234, 234);
    border: 1px solid #ccc;
  }

  [data-dark="true"] .dashboard-dropdown__toggle {
    background-color: #1a1919;
  }

  [data-dark="true"] .dashboard-dropdown__toggle-text {
   color: #e5e2e2;
  }

  [data-dark="true"] .dashboard-dropdown__arrow {
   color: #e5e2e2;
  }

 [data-dark="true"]  .dashboard-dropdown__menu a:hover {
    background-color: #335c60;
  }


</style>



<!-- JavaScript -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var dropdown = document.querySelector('.dashboard-dropdown');

    if (!dropdown) return;

    var dropdownToggle = dropdown.querySelector('.dashboard-dropdown__toggle');
    var dropdownMenu = dropdown.querySelector('.dashboard-dropdown__menu');
    var arrowIcon = dropdown.querySelector('.dashboard-dropdown__arrow');

    // Function to toggle the dropdown menu and arrow icon
    function toggleDropdownMenu() {
      var isMenuHidden = !dropdownMenu.classList.contains('show');

      dropdownMenu.classList.toggle('show', isMenuHidden);
      arrowIcon.classList.toggle('flipped', !isMenuHidden);
      dropdownToggle.setAttribute('aria-expanded', String(isMenuHidden));
    }

    dropdownToggle.addEventListener('click', function() {
      toggleDropdownMenu();
    });

    // Close the dropdown menu when clicking outside the container
    document.addEventListener('click', function(event) {
      var isClickedInsideContainer = dropdownToggle.contains(event.target) || dropdownMenu.contains(event.target);
      if (!isClickedInsideContainer) {
        dropdownMenu.classList.remove('show');
        arrowIcon.classList.add('flipped');
        dropdownToggle.setAttribute('aria-expanded', 'false');
      }
    });

    // Initial state: arrow facing down
    arrowIcon.classList.add('flipped');
  });
</script>
