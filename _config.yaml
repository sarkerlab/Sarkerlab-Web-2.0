# site properties and page defaults
title: Sarker Lab
subtitle: Emory University
header: images/header.jpg
footer: images/

# site social media and other links
links:
  #email: abeed@dbmi.emory.edu
  #twitter: sarkerabeed
  

### jekyll settings

# front matter defaults
defaults:

  # all markdown files
  - scope:
      path: ""
    values:
      layout: default

  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member

  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at
  - jekyll_picture_tag

picture:
  source: images/events
  output: generated
  presets:
    default:
      formats: [webp, original]
      widths: [320, 640, 960, 1280]
      sizes: "(max-width: 640px) 100vw, 640px"
      fallback_width: 640

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
